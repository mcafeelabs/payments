# The source of truth for this service in the registry. CI publishes it to
# github.com/mcafeelabs/services under services/payments/.
apiVersion: platform/v1
name: payments
owner: team-payments
chartProfile: http-api
provides:
  - name: api
    kind: http-endpoint
consumes:
  - service: identity
    output: api
config:
  schema: ./config-values.schema.yaml
